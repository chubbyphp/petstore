name: CI

on:
  push:
  schedule:
    - cron: '0 0 * * *'

jobs:
  docker-compose:
    name: docker-compose (production container)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: blacksmith docker
        uses: useblacksmith/setup-docker-builder@v1
      - name: docker build / start
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          docker compose -f docker-compose.ci.yml build --build-arg BUILDKIT_INLINE_CACHE=1
          docker compose -f docker-compose.ci.yml up -d --wait --wait-timeout 30
      - name: wait for nginx
        run: while ! nc -z localhost 443; do sleep 0.1; done
      - name: ping
        run: curl --insecure https://localhost/ping -vvv
      - name: openapi
        run: curl --insecure https://localhost/openapi -vvv
      - name: docker stop
        run: docker compose -f docker-compose.ci.yml stop
  php83:
    name: PHP 8.3
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: petstore
          POSTGRES_PASSWORD: KVKtkrTHhKuTJTor8pCP
          POSTGRES_USER: petstore
        ports:
          - 5432:5432
    steps:
      - name: checkout
        uses: actions/checkout@v6
      # started as early as possible (and not as a job service, which cannot mount the checked out realm import nor
      # pass the "start-dev --import-realm" command), so it is up by the time the integration tests run; the issuer
      # claim is fixed via KC_HOSTNAME to the docker bridge gateway (172.17.0.1), which is reachable from within the
      # ci container
      - name: keycloak start
        run: docker container run -d --name keycloak -p 8080:8080 -v ${GITHUB_WORKSPACE}/docker/development/keycloak/import:/opt/keycloak/data/import -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=TCUJyCbLtLbBc4eXYYzD9ecm -e KC_HOSTNAME=http://172.17.0.1:8080 quay.io/keycloak/keycloak:26.7 start-dev --import-realm
      - name: wait for databases
        run: |
          while ! nc -z localhost 5432; do sleep 0.1; done
      - name: composer test
        uses: docker://ghcr.io/chubbyphp/ci-php83:latest
        env:
          APP_ENV: phpunit
          POSTGRES_URI: 'pgsql://petstore:KVKtkrTHhKuTJTor8pCP@172.17.0.1:5432/petstore?charset=utf8'
          OIDC_ISSUER: 'http://172.17.0.1:8080/realms/petstore'
          OIDC_AUDIENCE: 'petstore'
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
