sonar.organization=chubbyphp
sonar.projectKey=chubbyphp_chubbyphp-petstore
sonar.projectName=chubbyphp-petstore

sonar.sources=src
sonar.tests=tests
sonar.language=php
sonar.sourceEncoding=UTF-8
sonar.php.coverage.reportPaths=build/phpunit/clover.xml
sonar.php.tests.reportPath=build/phpunit/junit.xml

# The bootstrap scripts (console, container, web) are excluded from coverage in phpunit.xml. Sonar still measures
# every file below sonar.sources, so they would be reported with 0% coverage unless excluded here as well.
sonar.coverage.exclusions=src/console.php,src/container.php,src/web.php

# The DTOs mirror the chubbyphp-api base classes (Chubbyphp\Api\Dto\*): _type and _links are the wire-format field
# names that chubbyphp-parsing hydrates by name (S116), and the collection constructor has to repeat the base class
# signature to give _links a default (S107). Both are dictated by the vendor library, not by this code base.
sonar.issue.ignore.multicriteria=dtoFieldNames,dtoConstructorParameters
sonar.issue.ignore.multicriteria.dtoFieldNames.ruleKey=php:S116
sonar.issue.ignore.multicriteria.dtoFieldNames.resourceKey=src/**/Dto/**/*.php
sonar.issue.ignore.multicriteria.dtoConstructorParameters.ruleKey=php:S107
sonar.issue.ignore.multicriteria.dtoConstructorParameters.resourceKey=src/**/Dto/**/*.php
